<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Early Bird</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2a43">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png?v=20261122e">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=20261122e">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=20261122d">
<style>
body{margin:0;font:16px/1.6 "Open Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#272b2e;background:#fff}
main{max-width:520px;margin:12vh auto;padding:0 20px;text-align:center}
h1{font:400 40px/1.1 "Abril Fatface",Georgia,serif;color:#0f2a43;margin:0 0 12px}
a.btn{display:inline-block;background:#265682;color:#fff;border-radius:3px;padding:13px 24px;font-weight:700;text-decoration:none;margin:6px}
</style>
<script>
// Restaurant links (https://eatearlybird.com/v/<slug>, the ones restaurants share and the iPhone app opens) land on the
// restaurant's page in the web booking app.
(function () {
  var m = location.pathname.match(/^\/v\/([^\/]+)\/?$/);
  if (m) location.replace("/book/#/r/" + m[1]);
  // Invite links (https://eatearlybird.com/r/<code>, what a diner shares from the app) open the invite page.
  var r = location.pathname.match(/^\/r\/([A-Za-z0-9-]{3,40})\/?$/);
  if (r) location.replace("/book/#/invite/" + r[1]);
})();
</script>
<script src="/book/config.js"></script>
<script>
// Tagged links for posts and ads (https://eatearlybird.com/go/<code>, made in the app's admin, migration 0204). On an
// iPhone with the app, the link opens the app instead and this page never loads. Here: count the tap with the
// browser's random device id (the same one the web booking uses, so a later sign-up or booking on this browser counts
// for the link), the kind of device and the referring site's host only, then go where the link points. No cookies,
// no third-party trackers. If counting fails or is slow, the visitor still goes on after 1.5 s.
(function () {
  var g = location.pathname.match(/^\/go\/([A-Za-z0-9-]{3,40})\/?$/);
  if (!g) return;
  document.documentElement.className = "going";
  var CFG = window.EB_CONFIG || {}, done = false;
  var go = function (to) { if (!done) { done = true; location.replace(to); } };
  var dest = function (r) {
    if (r && r.destination === "venue" && r.venue_slug) return "/book/#/r/" + encodeURIComponent(r.venue_slug);
    if (r && r.destination === "restaurants") return "/restaurants/";
    if (r && r.destination === "app") return CFG.url + "/functions/v1/beta-join";
    return "/book/";
  };
  var dev = null;
  try {
    dev = localStorage.getItem("eb.web.device");
    if (!dev && window.crypto && crypto.randomUUID) { dev = crypto.randomUUID().toLowerCase(); localStorage.setItem("eb.web.device", dev); }
  } catch (e) { /* private mode: count without a device id */ }
  var ua = navigator.userAgent || "";
  var platform = /iPhone|iPad|iPod/.test(ua) ? "ios" : /Android/.test(ua) ? "android" : /Mobi/.test(ua) ? "other" : "desktop";
  var ref = ""; try { ref = document.referrer ? new URL(document.referrer).host : ""; } catch (e) { ref = ""; }
  setTimeout(function () { go("/book/"); }, 1500);
  if (!CFG.url || !window.fetch) return go("/book/");
  fetch(CFG.url + "/rest/v1/rpc/link_click", {
    method: "POST", keepalive: true,
    headers: { "Content-Type": "application/json", "Content-Profile": "api", "Accept-Profile": "api", apikey: CFG.key, Authorization: "Bearer " + CFG.key },
    body: JSON.stringify({ p_code: g[1], p_device: dev, p_surface: "web", p_platform: platform, p_referrer: ref || null })
  }).then(function (res) { return res.ok ? res.json() : null; })
    .then(function (r) {
      if (r && r.destination === "post" && r.post && r.post.venues && r.post.venues.length) {
        done = true;   // stay here and show the post (once the page body exists)
        if (document.body) showPost(r.post); else document.addEventListener("DOMContentLoaded", function () { showPost(r.post); });
        return;
      }
      go(dest(r));
    },
          function () { go("/book/"); });
  // A post link (0215): the post's photos, caption and restaurants, each opening its booking page.
  function showPost(p) {
    var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var safe = function (u) { return /^https:\/\//.test(u || "") ? u : ""; };
    var h = '<main class="post">' + (p.media || []).filter(safe).map(function (m) { return '<img class="ph" src="' + esc(m) + '" alt="">'; }).join("");
    if (p.title) h += "<h1>" + esc(p.title) + "</h1>";
    if (p.caption) h += '<p class="cap">' + esc(p.caption) + "</p>";
    h += "<h2>" + (p.venues.length === 1 ? "The restaurant" : "The restaurants") + "</h2>";
    h += p.venues.map(function (v) {
      var sub = [v.area || v.city || "", (v.cuisines || []).join(", ")].filter(Boolean).join(" · ");
      return '<a class="v" href="/book/#/r/' + encodeURIComponent(v.slug) + '">' +
        (safe(v.photo) ? '<img src="' + esc(v.photo) + '" alt="">' : '<span class="i">' + esc(v.name.charAt(0)) + "</span>") +
        "<span><b>" + esc(v.name) + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "") +
        (v.discount ? '<em>' + esc(v.discount) + "% off food</em>" : "") + "</span></a>";
    }).join("") + '<a class="btn" href="/book/">Find more early tables</a></main>';
    document.title = (p.title || "From our post") + " | Early Bird";
    document.documentElement.className = "";
    document.body.innerHTML = h;
  }
})();
</script>
<style>main.post{max-width:520px;margin:0 auto;padding:16px 16px 48px;text-align:left}main.post .ph{width:100%;border-radius:14px;margin-bottom:10px;display:block}main.post h1{font-size:30px;margin:12px 0 8px}main.post .cap{white-space:pre-line}main.post h2{font:700 17px/1.3 "Open Sans",system-ui,sans-serif;margin:22px 0 10px}main.post a.v{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #e3e5ea;border-radius:14px;margin-bottom:10px;color:inherit;text-decoration:none}main.post a.v img,main.post a.v .i{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#eceef3;display:flex;align-items:center;justify-content:center;font-weight:700;color:#5f6673}main.post a.v span{display:flex;flex-direction:column;min-width:0}main.post small{color:#5f6673}main.post em{font-style:normal;font-size:12px;font-weight:700;color:#3d2e0a;background:#edc457;border-radius:99px;padding:1px 8px;align-self:flex-start;margin-top:3px}main.post .btn{display:block;text-align:center;margin:18px 0 0}</style>
<style>html.going main{display:none}html.going body:after{content:"Opening Early Bird…";display:block;margin:30vh auto;text-align:center;color:#0f2a43}</style>
</head>
<body>
<main>
  <h1>We couldn't find that page</h1>
  <p>Try the home page, or find an early table to book.</p>
  <a class="btn" href="/">Home</a><a class="btn" href="/book/">Find a table</a>
</main>
</body>
</html>
