<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set your password · Early Bird</title>
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png?v=20261122c">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=20261122c">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=20261122c">
<link rel="stylesheet" href="style.css">
<style>
  form { display: grid; gap: 12px; max-width: 420px; margin-top: 16px; }
  label { font-weight: 600; }
  input { font: inherit; padding: 12px; border: 1px solid #c9ced6; border-radius: 10px; }
  button { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: #12305a; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  .msg { margin-top: 12px; }
  .err { color: #b3261e; }
  .ok { color: #1b6e3a; }
</style>
</head>
<body>
<header><a class="brand" href="index.html"><span class="sun" aria-hidden="true"></span>Early Bird</a></header>
<main>
<h1>Set your password</h1>
<p id="intro">Choose a new password for your Early Bird account (at least 8 characters).</p>
<form id="f" hidden>
  <label for="p1">New password</label>
  <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
  <label for="p2">Type it again</label>
  <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
  <button id="b" type="submit">Save password</button>
</form>
<p id="m" class="msg"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var client = supabase.createClient("https://xopcdblqmmrvyocqomqz.supabase.co", "sb_publishable_TW9FPHv3ijsOZx4QPTIsdA_hSWFafW4",
    { auth: { persistSession: false, detectSessionInUrl: true, flowType: "implicit" } });
  var form = document.getElementById("f"), msg = document.getElementById("m"), btn = document.getElementById("b");
  function say(text, cls) { msg.textContent = text; msg.className = "msg " + (cls || ""); }
  var ready = false;
  // Supabase puts the link type in the fragment (#access_token=…&type=recovery). Only recovery links get the form;
  // other Auth links (email confirm / change, magic link) just say they worked.
  var type = new URLSearchParams(location.hash.slice(1)).get("type");
  client.auth.onAuthStateChange(function (event, session) {
    if (!session || ready) return;
    ready = true;
    if (type && type !== "recovery") {
      document.querySelector("h1").textContent = "You're all set";
      document.getElementById("intro").hidden = true;
      say("Your email address is confirmed. Open Early Bird to carry on.", "ok");
      client.auth.signOut();
      return;
    }
    form.hidden = false; say("");
  });
  setTimeout(function () {
    if (!ready) say("This link has expired or was already used. Ask for a new one from the app (Profile, Sign in, Forgot password).", "err");
  }, 4000);
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var a = document.getElementById("p1").value, b = document.getElementById("p2").value;
    if (a.length < 8) { say("Use at least 8 characters.", "err"); return; }
    if (a !== b) { say("The two passwords don't match.", "err"); return; }
    btn.disabled = true; say("Saving…");
    client.auth.updateUser({ password: a }).then(function (r) {
      if (r.error) { btn.disabled = false; say("Couldn't save: " + r.error.message, "err"); return; }
      form.hidden = true; document.getElementById("intro").hidden = true;
      say("Password saved. Open Early Bird and sign in with your email and this password.", "ok");
      client.auth.signOut();
    });
  });
})();
</script>
</body>
</html>
