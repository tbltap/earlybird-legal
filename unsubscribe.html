<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe | Early Bird</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f2a43">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png?v=20261122e">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=20261122d">
<style>
body{margin:0;font:16px/1.6 "Open Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#272b2e;background:#fff}
main{max-width:520px;margin:12vh auto;padding:0 20px;text-align:center}
h1{font:400 34px/1.15 "Abril Fatface",Georgia,serif;color:#0f2a43;margin:0 0 12px}
p{margin:0 0 18px}
.note{font-size:14px;color:#5f6673}
a{color:#265682}
</style>
<script src="/book/config.js"></script>
<script>if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) document.write('<script src="/book/config.local.js"><\/script>');</script>
</head>
<body>
<main>
  <h1 id="title">Unsubscribing…</h1>
  <p id="message">One moment.</p>
  <p class="note" id="after" hidden>Changed your mind? Write to <a href="mailto:support@eatearlybird.com">support@eatearlybird.com</a> and we'll turn them back on.</p>
  <p class="note"><a href="/">eatearlybird.com</a></p>
</main>
<script>
// The unsubscribe link in every Early Bird news and offers email (backend 0298): eatearlybird.com/unsubscribe?t=<token>.
// Signed out, it calls api.email_news_unsubscribe(token) at once: {ok: true, on: false} or {ok: false, reason: 'bad_link'}.
// (Restaurant offer emails use /u/<token> and api.email_unsubscribe, 0301.) The token is read once and then taken out of
// the address bar; it goes only to Early Bird's API, and the page sends no referrer.
(function () {
  var CFG = window.EB_CONFIG || {};
  var token = "";
  try { token = (new URLSearchParams(location.search).get("t") || "").trim().toLowerCase(); } catch (e) { token = ""; }
  try { history.replaceState(null, "", location.pathname); } catch (e) { /* old browser */ }
  var title = document.getElementById("title"), message = document.getElementById("message"), after = document.getElementById("after");
  function show(t, m) { title.textContent = t; message.textContent = m; }
  function bad() { show("This link doesn't work", "It may be old or incomplete. Write to support@eatearlybird.com and we'll take you off the list."); }
  if (!/^[0-9a-f-]{32,40}$/.test(token) || !CFG.url) { bad(); return; }
  fetch(CFG.url + "/rest/v1/rpc/email_news_unsubscribe", {
    method: "POST",
    headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key, "Content-Type": "application/json",
               "Content-Profile": "api", "Accept-Profile": "api" },
    body: JSON.stringify({ p_token: token })
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (j) { if (!res.ok) throw new Error("error"); return j; });
  }).then(function (r) {
    if (r && r.ok) { show("You're unsubscribed", "You won't get Early Bird news and offers by email any more. Emails about your bookings still come as usual."); after.hidden = false; }
    else bad();
  }).catch(function () {
    show("Something went wrong", "We couldn't unsubscribe you just now. Try the link again in a minute.");
  });
})();
</script>
</body>
</html>
